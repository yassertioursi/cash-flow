name: cashflow
description: Cashflow — a modern financial management app built with Clean Architecture and BLoC.
publish_to: "none"
version: 1.0.45+44

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  injectable: ^2.7.1+2
  fpdart: ^1.2.0
  equatable: ^2.0.7
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  sqflite: ^2.4.2
  uuid: ^4.5.2
  fl_chart: ^1.1.1
  shared_preferences: ^2.1.1
  crypto: ^3.0.7
  go_router: ^14.0.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  flutter_timezone: ^5.0.1
  file_picker: ^10.3.8
  sqflite_common_ffi_web: ^1.1.1
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  injectable_generator: ^2.6.2
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo-nbg.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0D14"
  adaptive_icon_foreground: "assets/logo-nbg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/logo-nbg.png
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
# see https://flutter.dev/to/font-from-package
